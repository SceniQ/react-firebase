<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <h1>My website</h1>
    <div id="banner">

    </div>
    <footer>
        <p>Footer</p>
    </footer>
    <script type="text/babel">
        const Banner = () =>{
            // only one root/parent element allowed
            const title = "Welcome to my self-paced React course site!"
            const subtitle = "This is where the great turnover begins"
            const address = "https://threadsafe.store"
            return (
                <div>
                    <h2>{title.toUpperCase()}</h2>
                    <p>{subtitle}</p>
                    <p>Today's date: {new Date().toString()}</p>
                    <p>Random number: {Math.random() * 100}</p>
                    <a href={address}>Uhmm... Thread safe?</a>
                </div>
            )
        }
        // render the component to the DOM
       ReactDOM.render(<Banner />, document.getElementById('banner')) 
    </script>
</body>
</html>
